<!DOCTYPE html>
<html>
<head>
    <title>Advanced Ticketing Settings API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .endpoint { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        button { margin: 5px; padding: 8px 15px; cursor: pointer; }
        .response { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
    </style>
</head>
<body>
    <h1>Advanced Ticketing Settings API Test</h1>
    
    <div class="endpoint">
        <h3>Ticket Tags</h3>
        <button onclick="testEndpoint('GET', '/api/settings/tags', null, 'tags-response')">GET Tags</button>
        <button onclick="testCreateTag()">CREATE Tag</button>
        <div id="tags-response" class="response" style="display:none;"></div>
    </div>

    <div class="endpoint">
        <h3>Graph Email Configs</h3>
        <button onclick="testEndpoint('GET', '/api/settings/email-config', null, 'email-response')">GET Email Configs</button>
        <button onclick="testCreateEmailConfig()">CREATE Email Config</button>
        <div id="email-response" class="response" style="display:none;"></div>
    </div>

    <div class="endpoint">
        <h3>Ticket Field Settings</h3>
        <button onclick="testEndpoint('GET', '/api/settings/ticket-fields', null, 'fields-response')">GET Field Settings</button>
        <button onclick="testCreateFieldSetting()">CREATE Field Setting</button>
        <div id="fields-response" class="response" style="display:none;"></div>
    </div>

    <div class="endpoint">
        <h3>Ticket Groups</h3>
        <button onclick="testEndpoint('GET', '/api/settings/groups', null, 'groups-response')">GET Groups</button>
        <button onclick="testCreateGroup()">CREATE Group</button>
        <div id="groups-response" class="response" style="display:none;"></div>
    </div>

    <script>
        async function testEndpoint(method, url, data, responseId) {
            const responseDiv = document.getElementById(responseId);
            responseDiv.style.display = 'block';
            responseDiv.innerHTML = 'Loading...';
            
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                const response = await fetch(url, options);
                const result = await response.text();
                
                responseDiv.className = response.ok ? 'response success' : 'response error';
                responseDiv.innerHTML = `
                    <strong>Status:</strong> ${response.status} ${response.statusText}<br>
                    <strong>Response:</strong><br>
                    <pre>${result}</pre>
                `;
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }
        
        async function testCreateTag() {
            const data = {
                name: "Urgent Issue",
                subCategoryId: 1
            };
            await testEndpoint('POST', '/api/settings/tags', data, 'tags-response');
        }
        
        async function testCreateEmailConfig() {
            const data = {
                tenantId: "test-tenant",
                clientId: "test-client",
                clientSecret: "test-secret",
                email: "test@example.com",
                categoryId: 1,
                processIncomingEmails: true,
                createTicketsFromEmails: true,
                sendNotifications: true
            };
            await testEndpoint('POST', '/api/settings/email-config', data, 'email-response');
        }
        
        async function testCreateFieldSetting() {
            const data = {
                categoryId: 1,
                fieldName: "Priority Level",
                fieldType: "select",
                isMandatory: true,
                options: "Low,Medium,High,Critical",
                placeholderText: "Select priority level",
                displayOrder: 1
            };
            await testEndpoint('POST', '/api/settings/ticket-fields', data, 'fields-response');
        }
        
        async function testCreateGroup() {
            const data = {
                name: "Support Team Alpha",
                description: "Primary support team for urgent issues",
                categoryId: 1
            };
            await testEndpoint('POST', '/api/settings/groups', data, 'groups-response');
        }
    </script>
</body>
</html>
