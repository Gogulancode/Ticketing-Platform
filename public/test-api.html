<!DOCTYPE html>
<html>
<head>
    <title>Custom Field Analytics Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #d1ecf1; color: #0c5460; }
        pre { background-color: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Custom Field Analytics API Test</h1>
    
    <div id="status" class="status loading">Testing API endpoint...</div>
    
    <h2>API Response:</h2>
    <pre id="response">Loading...</pre>
    
    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const responseDiv = document.getElementById('response');
            
            try {
                statusDiv.textContent = 'Testing basic endpoints first...';
                
                // Test basic API first
                try {
                    const basicTest = await fetch('/api/tickets/settings/statuses');
                    if (basicTest.ok) {
                        statusDiv.textContent = '✅ Basic API working. Testing custom field analytics...';
                    }
                } catch (basicError) {
                    throw new Error(`Basic API failed: ${basicError.message}`);
                }
                
                // Now test our custom analytics endpoint
                const response = await fetch('/api/tickets-v2/custom-fields/analytics?days=30');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                statusDiv.className = 'status success';
                statusDiv.textContent = `✅ Custom Field Analytics Working! Found ${data.summary.totalCategories} categories, ${data.summary.totalTickets} tickets`;
                
                responseDiv.textContent = JSON.stringify(data, null, 2);
                
                // Show a summary of the data
                responseDiv.textContent += `\n\n📊 SUMMARY:\n`;
                responseDiv.textContent += `- Date Range: ${data.dateRange.startDate} to ${data.dateRange.endDate}\n`;
                responseDiv.textContent += `- Categories: ${data.summary.totalCategories}\n`;
                responseDiv.textContent += `- Total Tickets: ${data.summary.totalTickets}\n`;
                responseDiv.textContent += `- Total Records: ${data.summary.totalRecords}\n`;
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ Error: ${error.message}`;
                
                responseDiv.textContent = `Error details: ${error.message}\n\n`;
                
                // Additional debugging
                responseDiv.textContent += `🔍 Debugging Info:\n`;
                responseDiv.textContent += `- Current URL: ${window.location.href}\n`;
                responseDiv.textContent += `- API Base: /api/tickets-v2/custom-fields/analytics\n`;
                responseDiv.textContent += `- Expected endpoint: http://localhost:5015/api/tickets-v2/custom-fields/analytics\n`;
            }
        }
        
        // Run test when page loads
        testAPI();
        
        // Auto-refresh every 5 seconds if there's an error
        setTimeout(() => {
            if (document.getElementById('status').className.includes('error')) {
                testAPI();
            }
        }, 5000);
    </script>
</body>
</html>
